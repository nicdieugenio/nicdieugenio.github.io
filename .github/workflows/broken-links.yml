name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          # Scoped to the prose we actually write.
          #   _includes  - Liquid templates; href="{{ ... }}" is not a real path.
          #                The rendered site is checked by broken-links-site.yml.
          #   theme docs, lighthouse_results, plotly demo, committed virtualenvs
          #              - full of dead and bot-blocked links unrelated to this site.
          #   open.spotify.com - answers 404 to any non-browser user agent.
          args: >-
            --user-agent 'curl/7.54'
            --exclude-path README.md --exclude-path INSTALL.md --exclude-path CUSTOMIZE.md
            --exclude-path FAQ.md --exclude-path CONTRIBUTING.md
            --exclude-path _pages/404.md --exclude-path _pages/blog.md
            --exclude-path lighthouse_results --exclude-path readme_preview
            --exclude-path assets/plotly/demo.html
            --exclude-path venv --exclude-path ovito-env --exclude-path vendor
            --exclude-path _includes --exclude-path _site --exclude-path node_modules
            --exclude 'open\.spotify\.com'
            --verbose --no-progress './**/*.md' './**/*.html'
